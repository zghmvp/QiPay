# QiPay 同域站点（HTTP）。官方 nginx 镜像从 conf.d 引入，此处已经在 http 上下文里。
# 管理端在 / ，骑手 H5 在 /rider-h5/ ，接口在 /api/ 。

map $http_upgrade $qipay_connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;
    # 空串时 security-headers-common.conf 不输出 Strict-Transport-Security。
    set $qipay_hsts "";
    include /etc/nginx/qipay-snippets/server.conf;
}
