# 启用 TLS 时用本文件替换 qipay.conf，并把证书挂到 /etc/qipay/certs/。
# 证书可用 scripts/gen-self-signed.sh 生成演练用自签证书，正式环境换成机构签发的证书。

map $http_upgrade $qipay_connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/qipay/certs/fullchain.pem;
    ssl_certificate_key /etc/qipay/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:qipay_ssl:10m;

    # 必须在 server 里设。/rider-h5/ 有自己的 add_header，不会继承 server 级响应头。
    set $qipay_hsts "max-age=15552000";
    include /etc/nginx/qipay-snippets/server.conf;
}
