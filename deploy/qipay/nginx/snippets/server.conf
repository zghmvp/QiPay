root /var/www/admin;
index index.html;
server_tokens off;
client_max_body_size 20m;

charset utf-8;
charset_types text/css application/json image/svg+xml;

gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;
gzip_vary on;

access_log /var/log/nginx/access.log;
error_log /var/log/nginx/error.log warn;

set $qipay_upstream backend:8000;
resolver 127.0.0.11 valid=10s ipv6=off;

include /etc/nginx/qipay-snippets/security-headers.conf;
include /etc/nginx/qipay-snippets/locations.conf;
