# 管理端（location /）的 CSP。
# script-src 和 style-src 都不能去掉 'unsafe-inline'：
# 框架构建插件 internal/vite-config/src/plugins/inject-app-loading/index.ts
# 会往 index.html 注入一段读取 localStorage 主题的内联脚本，
# default-loading.html 还会注入一段内联 <style>。
# 这两处都在框架目录，本仓库不改。脚本正文里嵌了包版本号，
# 用 hash 钉死的话，管理端每次升级版本都要改这份配置，漏改就是白屏。
# H5 用 security-headers-h5.conf，不走这里的 script-src。
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
include /etc/nginx/qipay-snippets/security-headers-common.conf;
