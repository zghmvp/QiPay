# 与 CSP 无关的站点响应头。管理端和 H5 共用，避免两处策略漂移。
# $qipay_hsts 由 server 块设置。值为空时 nginx 不输出这个头，所以 HTTP 模式没有 HSTS。
# 写在这里，/rider-h5/ 的 location 不会漏掉 TLS 上的 Strict-Transport-Security。
add_header Strict-Transport-Security $qipay_hsts always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
