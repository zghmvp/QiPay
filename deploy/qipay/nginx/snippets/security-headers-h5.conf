# /rider-h5/ 专用。script-src 与 style-src 都是 'self'，不含 'unsafe-inline'。
# 生产 index.html 只有外链 module 脚本和外链样式；验证码图片是 data: URI。
# 数字字体是本域 woff2。Vant 图标字体只保留 data:font/woff2，
# 构建时去掉 at.alicdn.com 的 woff 回退（rider-h5/build/strip-alicdn-font.ts）。
# 不要退回 'unsafe-inline'，也不要为这个回退放行外链字体。
# 本文件在 location 里引入。location 一旦有自己的 add_header，就不再继承 server 级响应头，
# 所以这里要带上全部安全头，不能只写 CSP。
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
include /etc/nginx/qipay-snippets/security-headers-common.conf;
