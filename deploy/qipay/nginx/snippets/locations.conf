# 由 server 块引入。调用方要先设置 $qipay_upstream，例如 backend:8000。

location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# P3-03：生产环境不暴露无验证码的 swagger 登录。在反代之前直接 404。
location = /api/v1/auth/login/swagger {
    default_type application/json;
    return 404 '{"code":404,"msg":"未找到","data":null}';
}

location = /api/v1/auth/login/swagger/ {
    default_type application/json;
    return 404 '{"code":404,"msg":"未找到","data":null}';
}

# 进程指标。ENVIRONMENT=prod 时框架会挂上 /metrics。不要对它做高频压测。
location = /api/healthz {
    access_log off;
    proxy_pass http://$qipay_upstream/metrics/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
}

location /api/ {
    proxy_pass http://$qipay_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
}

location /ws/ {
    proxy_pass http://$qipay_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $qipay_connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Q-17：H5 挂在 /rider-h5/。未知路径回落到 index.html，刷新 history 路由不会 404。
# 这里单独挂更严的 CSP（script-src 'self'，无 unsafe-inline）。location 有自己的
# add_header 后不再继承 server 级安全头，缺头的话只剩 CSP。
location /rider-h5/ {
    include /etc/nginx/qipay-snippets/security-headers-h5.conf;
    root /var/www;
    try_files $uri $uri/ /rider-h5/index.html;
}

location / {
    try_files $uri $uri/ /index.html;
}

error_page 502 504 @qipay_backend_down;

location @qipay_backend_down {
    default_type application/json;
    return 502 '{"code":502,"msg":"后端暂不可用","data":null}';
}
